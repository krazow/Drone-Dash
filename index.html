<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}}</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1b; --quiet:#6b6a66; --line:#e3e1dc;
          --identified:#2563eb; --rid:#d97706; --dji:#7c3aed; --unknown:#dc2626; --ok:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg);
         display:grid; grid-template-columns:1fr 360px; grid-template-rows:52px 1fr; height:100vh; }
  header { grid-column:1/3; display:flex; align-items:center; gap:16px; padding:0 16px; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  #conn { font-size:12px; color:var(--quiet); }
  #conn.live::before { content:"● "; color:var(--ok); }
  #conn.down::before { content:"● "; color:var(--unknown); }
  .legend { margin-left:auto; display:flex; gap:12px; font-size:12px; color:var(--quiet); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  #map { height:100%; }
  aside { overflow:auto; background:var(--panel); border-left:1px solid var(--line); padding:12px 14px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--quiet); margin:16px 0 8px; }
  h2:first-child { margin-top:0; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .stat b { display:block; font-size:18px; }
  .stat span { font-size:11px; color:var(--quiet); }
  .item { border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:8px 10px;
          margin-bottom:6px; cursor:pointer; }
  .item:hover, .item.sel { background:#f2f1ee; }
  .item .top { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
  .item .sub { color:var(--quiet); font-size:12px; word-break:break-all; }
  .tag { font-size:11px; font-weight:600; color:var(--c); }
  .spoof { color:var(--unknown); font-size:11px; font-weight:600; white-space:nowrap; word-break:normal; }
  .empty { color:var(--quiet); font-size:13px; }
  table.kv { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.kv td { padding:3px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  table.kv td:first-child { color:var(--quiet); width:40%; }
  .node { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
  .pulse { animation:pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { stroke-opacity:.9; fill-opacity:.25; } 100% { stroke-opacity:.1; fill-opacity:0; } }
  @media (max-width:800px) { body { grid-template-columns:1fr; grid-template-rows:52px 55vh auto; }
    aside { border-left:0; border-top:1px solid var(--line); } .legend { display:none; } }
</style>
</head>
<body>
<header>
  <h1>{{APP_NAME}}</h1><span id="conn" class="down">connecting…</span>
  <div class="legend">
    <span><i class="dot" style="background:var(--identified)"></i>Identified</span>
    <span><i class="dot" style="background:var(--rid)"></i>Remote ID</span>
    <span><i class="dot" style="background:var(--dji)"></i>DJI DroneID</span>
    <span><i class="dot" style="background:var(--unknown)"></i>Unknown</span>
  </div>
</header>
<div id="map"></div>
<aside>
  <h2>Last 24 hours</h2>
  <div class="stats" id="stats"></div>
  <h2>Now flying</h2>
  <div id="live"><p class="empty">No drones detected right now.</p></div>
  <h2>Selected</h2>
  <div id="detail"><p class="empty">Click a drone on the map or in the list.</p></div>
  <h2>Sensor nodes</h2>
  <div id="nodes"></div>
  <h2>Earlier today</h2>
  <div id="history"></div>
</aside>
<script>
const COLORS = { identified:"#2563eb", rid:"#d97706", dji:"#7c3aed", unknown:"#dc2626" };
const LABELS = { identified:"Identified", rid:"Remote ID", dji:"DJI DroneID", unknown:"Unknown drone" };
const map = L.map("map", { zoomControl:true }).setView([46.296, -118.06], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom:19, attribution:"&copy; OpenStreetMap contributors" }).addTo(map);

const tracks = new Map();   // track_id -> {data, marker, trail, pilot, link, ring}
const nodeLayers = new Map();
let liveSecs = 120, selected = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { if (!t) return "never"; const s = Math.round(Date.now()/1000 - t);
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s/60)} min ago` : `${Math.round(s/3600)} h ago`; };
const fmt = (v, unit, d=0) => v == null ? "—" : `${Number(v).toFixed(d)} ${unit}`;
const title = t => t.cls === "unknown" ? `Unknown drone near ${t.nodes[0]}` : (t.manufacturer || LABELS[t.cls]);

function upsert(t, point) {
  let e = tracks.get(t.track_id);
  const c = COLORS[t.cls];
  if (!e) {
    e = { trail: L.polyline([], { color:c, weight:2, opacity:.7 }).addTo(map) };
    tracks.set(t.track_id, e);
  }
  e.data = t;
  e.trail.setStyle({ color:c });
  if (t.trail) e.trail.setLatLngs(t.trail);
  else if (point) { const ll = e.trail.getLatLngs(); ll.push(point); e.trail.setLatLngs(ll.slice(-120)); }

  if (t.cls === "unknown") {
    if (!e.ring) e.ring = L.circle([t.lat, t.lon], { radius:1200, color:c, weight:2, className:"pulse" }).addTo(map)
        .on("click", () => select(t.track_id));
  } else if (t.lat != null) {
    if (!e.marker) e.marker = L.circleMarker([t.lat, t.lon], { radius:8, color:"#fff", weight:2, fillColor:c, fillOpacity:1 })
        .addTo(map).on("click", () => select(t.track_id));
    e.marker.setLatLng([t.lat, t.lon]).setStyle({ fillColor:c })
      .bindTooltip(`${esc(title(t))} · ${fmt(t.alt,"m")}`);
    if (t.pilot_lat != null) {
      const pl = [t.pilot_lat, t.pilot_lon];
      if (!e.pilot) {
        e.pilot = L.circleMarker(pl, { radius:5, color:c, weight:2, fillColor:"#fff", fillOpacity:1 }).addTo(map)
          .bindTooltip("Pilot / takeoff point");
        e.link = L.polyline([], { color:c, weight:1.5, dashArray:"4 5" }).addTo(map);
      }
      e.pilot.setLatLng(pl);
      e.link.setLatLngs([[t.lat, t.lon], pl]);
    }
  }
}

function remove(id) {
  const e = tracks.get(id); if (!e) return;
  ["marker","trail","pilot","link","ring"].forEach(k => e[k] && map.removeLayer(e[k]));
  tracks.delete(id);
  if (selected === id) { selected = null; renderDetail(); }
}

function renderList() {
  const items = [...tracks.values()].map(e => e.data).sort((a,b) => b.last_seen - a.last_seen);
  document.getElementById("live").innerHTML = items.length ? items.map(t => `
    <div class="item ${t.track_id===selected?"sel":""}" style="--c:${COLORS[t.cls]}" data-id="${esc(t.track_id)}">
      <div class="top"><span>${esc(title(t))}</span><span class="tag">${LABELS[t.cls]}</span></div>
      <div class="sub">${t.cls==="unknown" ? "Drone-like radio activity, no ID broadcast" : esc(t.uas_id)}</div>
      <div class="sub">${t.cls==="unknown" ? "" : `alt ${fmt(t.alt,"m")} · ${fmt(t.speed,"m/s",1)} · `}heard by ${esc(t.nodes.join(", "))} · ${ago(t.last_seen)}
        ${t.spoof ? '<span class="spoof"> · possible spoof</span>' : ""}</div>
    </div>`).join("") : '<p class="empty">No drones detected right now.</p>';
  document.querySelectorAll("#live .item").forEach(el => el.onclick = () => select(el.dataset.id));
}

function renderDetail() {
  const el = document.getElementById("detail");
  const e = selected && tracks.get(selected);
  if (!e) { el.innerHTML = '<p class="empty">Click a drone on the map or in the list.</p>'; return; }
  const t = e.data;
  const rows = [["Class", LABELS[t.cls]], ["ID", t.uas_id || "—"], ["ID type", t.id_type || "—"],
    ["Maker", t.manufacturer || "—"], ["Altitude", fmt(t.alt,"m")], ["Speed", fmt(t.speed,"m/s",1)],
    ["Heading", fmt(t.heading,"°")], ["Signal", fmt(t.rssi,"dBm")],
    ["Position", t.lat!=null ? `${t.lat.toFixed(5)}, ${t.lon.toFixed(5)}` : "—"],
    ["Pilot / takeoff", t.pilot_lat!=null ? `${t.pilot_lat.toFixed(5)}, ${t.pilot_lon.toFixed(5)}` : "—"],
    ["Heard by", t.nodes.join(", ")], ["Via", t.sources.join(", ") || "—"],
    ["First seen", ago(t.first_seen)], ["Last seen", ago(t.last_seen)], ["Messages", t.hits],
    ["Spoof check", t.spoof ? "FAILED: impossible jump in position" : "OK"]];
  el.innerHTML = `<table class="kv">${rows.map(([k,v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>`;
}

function select(id) {
  selected = id; renderList(); renderDetail();
  const t = tracks.get(id)?.data;
  if (t && t.lat != null) map.panTo([t.lat, t.lon]);
}

function renderNodes(nodes) {
  document.getElementById("nodes").innerHTML = nodes.map(n => {
    const up = n.last_seen && Date.now()/1000 - n.last_seen < 600;
    if (!nodeLayers.has(n.node)) {
      nodeLayers.set(n.node, L.layerGroup([
        L.circle([n.lat, n.lon], { radius:1500, color:"#6b6a66", weight:1, dashArray:"3 6", fill:false }),
        L.marker([n.lat, n.lon], { title:n.node }).bindTooltip(n.node)]).addTo(map));
    }
    return `<div class="node"><span><i class="dot" style="background:${up?"var(--ok)":"#bbb"}"></i>${esc(n.node)}</span>
      <span class="sub">${up ? "online" : "offline"} · ${ago(n.last_seen)}</span></div>`;
  }).join("");
}

function renderStats(c) {
  document.getElementById("stats").innerHTML = ["identified","rid","dji","unknown"].map(k =>
    `<div class="stat" style="border-top:3px solid ${COLORS[k]}"><b>${c[k]||0}</b><span>${LABELS[k]}</span></div>`).join("");
}

async function loadHistory() {
  const rows = await (await fetch("api/history?hours=24")).json();
  const live = new Set(tracks.keys());
  const old = rows.filter(t => !live.has(t.track_id)).slice(0, 20);
  document.getElementById("history").innerHTML = old.length ? old.map(t => `
    <div class="item" style="--c:${COLORS[t.cls]};cursor:default">
      <div class="top"><span>${esc(title(t))}</span><span class="tag">${LABELS[t.cls]}</span></div>
      <div class="sub">${esc(t.uas_id || "")} · ${esc(t.nodes.join(", "))} · ${ago(t.last_seen)}</div></div>`).join("")
    : '<p class="empty">Nothing else in the last 24 hours.</p>';
}

async function refresh() {
  const s = await (await fetch("api/state")).json();
  liveSecs = s.live_secs;
  const ids = new Set(s.tracks.map(t => t.track_id));
  [...tracks.keys()].forEach(id => ids.has(id) || remove(id));
  s.tracks.forEach(t => upsert(t));
  renderNodes(s.nodes); renderStats(s.last24h); renderList(); renderDetail(); loadHistory();
}

function connect() {
  const ws = new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}${location.pathname.replace(/[^/]*$/,"")}ws`);
  const conn = document.getElementById("conn");
  ws.onopen = () => { conn.className = "live"; conn.textContent = "live"; };
  ws.onclose = () => { conn.className = "down"; conn.textContent = "reconnecting…"; setTimeout(connect, 3000); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "track") { upsert(m.track, m.point); renderList(); if (selected === m.track.track_id) renderDetail(); }
  };
  setInterval(() => ws.readyState === 1 && ws.send("ping"), 25000);
}

connect();
// Full refresh drops stale drones and updates node health and counts.
// If the live socket is down, poll faster so the map still moves.
let wsUp = false;
setInterval(() => { wsUp = document.getElementById("conn").className === "live"; }, 1000);
(function loop() { refresh().catch(() => {}).finally(() => setTimeout(loop, wsUp ? 15000 : 3000)); })();
</script>
</body>
</html>
